<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to Sailing Frog's Leap. Glad you found my website.">
  <title>Sailing Frog's Leap</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eef3e9; color: #193e32; font-family: Georgia, serif; }
    main { width: 100%; max-width: 760px; padding: 64px 24px; text-align: center; }
    .frog { font-size: 64px; margin-bottom: 28px; }
    .name { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }
    h1 { margin: 24px 0; font-size: clamp(40px, 8vw, 76px); line-height: 1.1; font-weight: normal; }
    .welcome { margin: 0; font-family: Arial, sans-serif; font-size: clamp(18px, 3vw, 22px); line-height: 1.6; color: #456154; }
    .line { width: 52px; height: 3px; background: #819c63; margin: 36px auto 0; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="frog" aria-hidden="true">🐸</div>
    <p class="name">Sailing Frog's Leap</p>
    <h1>Welcome to Sailing Frog's Leap.</h1>
    <p class="welcome">Glad you found my website.</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
